# Jira Ticket Check (Server-Side Enforcement)
#
# Every PR must reference a Jira ticket key that actually exists in this
# same app's own jira_issues table. Fails the check (and blocks merge, once
# wired into a required ruleset) if it can't find one, or if the key it
# finds is not a real ticket.
#
# This is a direct copy, not a workflow_call into salescode-ai/
# salescode-jenkins-pipelines's version of the same file -- that source
# lives under a different account entirely, and neither its self-hosted
# runner nor a cross-account reusable-workflow call is reachable from here.
# Keep both copies in sync by hand if the shared logic changes.
#
# A single request to this app's own public badge route does everything:
# parses the key from the PR title (branch name as fallback, first match
# only), looks it up against this app's jira_issues table, renders whichever
# of three banners applies (no key found / key found but not a real ticket /
# key found and credited), and reports which one via the X-Jira-Check
# response header. That header is this job's own pass/fail signal.
#
# One comment total, ever, regardless of outcome: found-and-updated in
# place if a marker comment already exists, only created new if none does
# yet. This used to always POST a new comment on every failed run
# specifically so a developer got emailed on every failure -- but a PR
# retitled several times while still failing racked up one comment per
# attempt, bloating the PR's own conversation/review size. GitHub only
# emails on comment *creation*, never on edit, so unifying to
# found-and-updated trades that per-failure email away: only the very
# first comment on a PR (pass or fail, whichever happens first) sends an
# email; every update after that -- another failure, a fix, a flip to
# passing -- silently rewrites the same comment instead of adding a new
# one.

name: Jira Ticket Check

on:
  # No branches: filter -- every PR needs a Jira ticket key regardless of
  # target branch, not just main.
  #
  # pull_request_target, not pull_request: always runs the copy of this
  # file committed to this repo's own default branch, regardless of what
  # either branch in a given PR contains -- so a PR between two old,
  # long-lived branches that never merged this file in still triggers the
  # check. Safe here: this job never checks out or executes anything from
  # the PR itself, it only reads title/number/head_ref off the trusted
  # event payload and calls this app's own public badge endpoint.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: jira-ticket-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  jira-ticket-check:
    name: Check for a valid Jira ticket reference
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate against this app's own Jira data and comment the result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          node -e '
            (async () => {
              const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
              const api = `https://api.github.com/repos/${owner}/${repo}`;
              const headers = {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json",
                "X-GitHub-Api-Version": "2022-11-28",
              };

              const badgeParams = new URLSearchParams({
                repo: process.env.GITHUB_REPOSITORY,
                pr: process.env.PR_NUMBER,
                title: process.env.PR_TITLE ?? "",
                branch: process.env.BRANCH_NAME ?? "",
              });
              const imageUrl = `https://salescode-sdlc-v2.vercel.app/api/badges/jira-ticket-check?${badgeParams}`;

              const badgeRes = await fetch(imageUrl);
              if (!badgeRes.ok) throw new Error(`badge fetch failed: ${badgeRes.status}`);
              const checkResult = badgeRes.headers.get("x-jira-check");
              const passed = checkResult === "pass";
              console.log(`Jira ticket check result: ${badgeRes.headers.get("x-jira-check-result")} (${passed ? "pass" : "fail"})`);

              const marker = "<!-- jira-ticket-check -->";
              const body = `${marker}\n![Jira Ticket Check](${imageUrl})`;

              const listRes = await fetch(`${api}/issues/${process.env.PR_NUMBER}/comments?per_page=100`, { headers });
              if (!listRes.ok) throw new Error(`list comments failed: ${listRes.status} ${await listRes.text()}`);
              const comments = await listRes.json();
              // findLast, not find: a leftover PR from before this became a
              // single persistent comment could still have more than one
              // marker comment on it -- updating the most recent one is the
              // one that reflects what actually needs to change.
              const existing = comments.findLast((c) => c.body?.includes(marker));

              const res = existing
                ? await fetch(`${api}/issues/comments/${existing.id}`, { method: "PATCH", headers, body: JSON.stringify({ body }) })
                : await fetch(`${api}/issues/${process.env.PR_NUMBER}/comments`, { method: "POST", headers, body: JSON.stringify({ body }) });
              if (!res.ok) throw new Error(`${existing ? "update" : "create"} comment failed: ${res.status} ${await res.text()}`);
              console.log(`${existing ? "Updated" : "Created"} the PR comment${existing ? " (no fresh email)" : " (first comment on this PR -- one email)"}.`);

              if (!passed) process.exit(1);
            })();
          '
